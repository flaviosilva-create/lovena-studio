name: Deploy Lovena Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>\s*(.*?)\s*</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          if 'default_language: "en"' not in html:
              raise SystemExit("Lovena source language must remain English")
          if html.count("https://cdn.gtranslate.net/widgets/latest/dropdown.js") != 1:
              raise SystemExit("Expected exactly one GTranslate widget")
          if "google_translate_element" in html or "translate.google.com/translate_a/element.js" in html:
              raise SystemExit("Legacy Google Translate widget must not be loaded alongside GTranslate")
          for element_id in ["studioOverlay", "readerOverlay", "studioToast", "loveWorldHeadingCopy"]:
              if f'id="{element_id}"' not in html:
                  raise SystemExit(f"Missing dynamic translation root: {element_id}")
          bridge = Path("translation-bridge.js").read_text(encoding="utf-8")
          if "translate.googleapis.com/translate_a/single" not in bridge:
              raise SystemExit("Dynamic UI translation engine is missing")
          if 'var lang = (parts[0] || SOURCE_LANGUAGE).trim();' not in bridge:
              raise SystemExit("GTranslate target-language parsing is incorrect")
          if '"studioOverlay", "readerOverlay", "studioToast", "loveWorldHeadingCopy"' not in bridge:
              raise SystemExit("Full creator/preview translation roots are missing")
          if "function renderStudio(){renderBody();if(window.LovenaTranslationBridge)window.LovenaTranslationBridge.refresh();}" not in html:
              raise SystemExit("Creator render is not wired to the translation bridge")
          Path("/tmp/lovena-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/lovena-inline.js
          node --check translation-bridge.js
          node <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("/tmp/lovena-inline.js", "utf8");
          const match = src.match(/var exportScript\s*=\s*([\s\S]*?);\s*\n\s*var doc=/);
          if (!match) throw new Error("Standalone story export was not found");
          const generated = Function("state", "return (" + match[1] + ");")({recipient:"Lovena Validation"});
          const embedded = generated.match(/<script>([\s\S]*?)<\/script>/);
          if (!embedded) throw new Error("Standalone story script was not generated");
          fs.writeFileSync("/tmp/lovena-export.js", embedded[1]);
          NODE
          node --check /tmp/lovena-export.js
      - name: Smoke test keyless dynamic translation endpoint (non-blocking)
        continue-on-error: true
        run: |
          node <<'NODE'
          (async () => {
            const url = new URL("https://translate.googleapis.com/translate_a/single");
            url.searchParams.set("client", "gtx");
            url.searchParams.set("sl", "en");
            url.searchParams.set("tl", "pt");
            url.searchParams.set("dt", "t");
            url.searchParams.set("q", "How are you today?");
            try {
              const origin = "https://flaviosilva-create.github.io";
              const response = await fetch(url, { headers: { "Accept": "application/json", "Origin": origin } });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const allowOrigin = response.headers.get("access-control-allow-origin");
              if (allowOrigin !== "*" && allowOrigin !== origin) throw new Error("CORS does not allow the Lovena origin (header: " + allowOrigin + ")");
              const data = await response.json();
              const translated = Array.isArray(data?.[0]) ? data[0].map(x => x?.[0] || "").join("") : "";
              if (!translated || translated === "How are you today?") throw new Error("No translated text was returned");
              console.log("Keyless dynamic translation endpoint passed: " + translated);
            } catch (error) {
              console.log("Keyless dynamic translation endpoint failed: " + error.message);
              process.exitCode = 1;
            }
          })();
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
