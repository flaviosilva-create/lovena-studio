name: Deploy Lovena Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate landing page and language selector
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          inline_scripts = re.findall(r"<script>\s*(.*?)\s*</script>", html, re.S)
          if len(inline_scripts) != 1:
              raise SystemExit(f"Expected one small GTranslate configuration script, found {len(inline_scripts)}")
          if "window.gtranslateSettings" not in inline_scripts[0] or "function openStudio()" in html:
              raise SystemExit("Only the landing page language configuration may remain inline")
          Path("/tmp/lovena-gtranslate-config.js").write_text(inline_scripts[0], encoding="utf-8")
          for marker in ['id="lr-main"', 'id="lr-footer"', 'class="lr-hero"', 'id="top"']:
              if marker not in html:
                  raise SystemExit(f"Landing page is missing required structure: {marker}")
          if 'href="./landing.css?v=20261023-real-flag-images-1"' not in html:
              raise SystemExit("The existing landing page stylesheet must remain linked")
          if 'default_language: "en"' not in html:
              raise SystemExit("Lovena source language must remain English")
          if html.count("https://cdn.gtranslate.net/widgets/latest/dropdown.js") != 1:
              raise SystemExit("Expected exactly one GTranslate widget")
          if "google_translate_element" in html or "translate.google.com/translate_a/element.js" in html:
              raise SystemExit("Legacy Google Translate widget must not be loaded alongside GTranslate")
          if 'translation-bridge.js?v=20261023-en-option-fix-1' not in html:
              raise SystemExit("The existing language-selector support must remain loaded")
          if 'id="studioOverlay"' in html or 'id="readerOverlay"' in html or "function openStudio()" in html:
              raise SystemExit("The removed creator/recipient experience must not be reintroduced")
          bridge = Path("translation-bridge.js").read_text(encoding="utf-8")
          for required in [
              'var CACHE_KEY = "lovenaDynamicTranslationCacheV3";',
              'return selectors.find(isElementVisible) || selectors[0] || null;',
              "function clearGoogleTranslateCookies()",
              "function ensureEnglishOption(selector)",
              'english.value = SOURCE_LANGUAGE + "|" + SOURCE_LANGUAGE;',
              'if (!parts.length) return "";',
              "if (language === SOURCE_LANGUAGE)",
              "translate.googleapis.com/translate_a/single",
              'if (first === SOURCE_LANGUAGE.toLowerCase()) lang = parts[parts.length - 1];'
          ]:
              if required not in bridge:
                  raise SystemExit(f"Language-selector validation failed: missing {required}")
          PY
          node --check /tmp/lovena-gtranslate-config.js
          node --check translation-bridge.js
          node <<'NODE'
          const fs = require("fs");
          const bridge = fs.readFileSync("translation-bridge.js", "utf8");
          const start = bridge.indexOf("  function canonicalLanguage(value) {");
          const end = bridge.indexOf("\n  function readSavedLanguage", start);
          if (start < 0 || end < 0) throw new Error("Could not extract GTranslate language parser");
          const parserSource = bridge.slice(start, end).replace("  function canonicalLanguage(value)", "return function canonicalLanguage(value)");
          const parseLanguage = new Function("SOURCE_LANGUAGE", parserSource) ("en");
          const cases = [["en|pt","pt"],["en|es","es"],["en|en","en"],["pt|en","pt"],["fr","fr"],["",""]];
          for (const [input, expected] of cases) {
            const actual = parseLanguage(input);
            if (actual !== expected) throw new Error(input + " parsed as " + actual + ", expected " + expected);
          }
          console.log("GTranslate language-value tests passed.");
          NODE
      - name: Smoke test keyless dynamic translation endpoint (non-blocking)
        continue-on-error: true
        run: |
          node <<'NODE'
          (async () => {
            const url = new URL("https://translate.googleapis.com/translate_a/single");
            url.searchParams.set("client", "gtx");
            url.searchParams.set("sl", "en");
            url.searchParams.set("tl", "pt");
            url.searchParams.set("dt", "t");
            url.searchParams.set("q", "How are you today?");
            try {
              const origin = "https://flaviosilva-create.github.io";
              const response = await fetch(url, { headers: { "Accept": "application/json", "Origin": origin } });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const allowOrigin = response.headers.get("access-control-allow-origin");
              if (allowOrigin !== "*" && allowOrigin !== origin) throw new Error("CORS does not allow the Lovena origin (header: " + allowOrigin + ")");
              const data = await response.json();
              const translated = Array.isArray(data?.[0]) ? data[0].map(x => x?.[0] || "").join("") : "";
              if (!translated || translated === "How are you today?") throw new Error("No translated text was returned");
              console.log("Keyless dynamic translation endpoint passed: " + translated);
            } catch (error) {
              console.log("Keyless dynamic translation endpoint failed: " + error.message);
              process.exitCode = 1;
            }
          })();
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
