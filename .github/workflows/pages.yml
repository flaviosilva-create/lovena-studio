name: Deploy Lovena Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>\s*(.*?)\s*</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          if 'default_language: "en"' not in html:
              raise SystemExit("Lovena source language must remain English")
          if html.count("https://cdn.gtranslate.net/widgets/latest/dropdown.js") != 1:
              raise SystemExit("Expected exactly one GTranslate widget")
          if "google_translate_element" in html or "translate.google.com/translate_a/element.js" in html:
              raise SystemExit("Legacy Google Translate widget must not be loaded alongside GTranslate")
          for element_id in ["studioStepBody", "studioControls", "studioStepNav", "studioMiniPreview", "readerCard", "readerProgress"]:
              if f'id="{element_id}"' not in html:
                  raise SystemExit(f"Missing dynamic translation root: {element_id}")
          bridge = Path("translation-bridge.js").read_text(encoding="utf-8")
          if "translate-pa.googleapis.com/v1/translateHtml" not in bridge:
              raise SystemExit("Dynamic UI translation engine is missing")
          if "function renderStudio(){renderBody();if(window.LovenaTranslationBridge)window.LovenaTranslationBridge.refresh();}" not in html:
              raise SystemExit("Creator render is not wired to the translation bridge")
          Path("/tmp/lovena-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/lovena-inline.js
          node --check translation-bridge.js
          NODE
      - name: Smoke test dynamic translation provider (non-blocking)
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require("fs");
          (async () => {
            const bridge = fs.readFileSync("translation-bridge.js", "utf8");
            const keyMatch = bridge.match(/var TRANSLATE_KEY = "([^"]+)"/);
            if (!keyMatch) { console.log("Translation service key is not configured."); return; }
            for (const client of ["wt_lib", "te"]) {
              try {
                const response = await fetch("https://translate-pa.googleapis.com/v1/translateHtml", {
                  method: "POST",
                  headers: { "Content-Type": "application/json+protobuf", "X-Goog-API-Key": keyMatch[1] },
                  body: JSON.stringify([[["How are you today?"], "en", "pt"], client])
                });
                const body = await response.text();
                if (response.ok) {
                  const parsed = JSON.parse(body);
                  const result = Array.isArray(parsed?.[0]) ? parsed[0][0] : "";
                  if (result && result !== "How are you today?") {
                    console.log("Translation service smoke test passed (" + client + "): " + result);
                    return;
                  }
                  console.log("Translation service responded but returned no translated text (" + client + ").");
                } else {
                  console.log("Translation service returned HTTP " + response.status + " (" + client + "): " + body.slice(0, 250));
                }
              } catch (error) {
                console.log("Translation service probe failed (" + client + "): " + error.message);
              }
            }
          })().catch(error => console.log("Non-blocking translation probe error: " + error.message));
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          const fs = require("fs");
          const src = fs.readFileSync("/tmp/lovena-inline.js", "utf8");
          const match = src.match(/var exportScript\s*=\s*([\s\S]*?);\s*\n\s*var doc=/);
          if (!match) throw new Error("Standalone story export was not found");
          const generated = Function("state", "return (" + match[1] + ");")({recipient:"Lovena Validation"});
          const embedded = generated.match(/<script>([\s\S]*?)<\/script>/);
          if (!embedded) throw new Error("Standalone story script was not generated");
          fs.writeFileSync("/tmp/lovena-export.js", embedded[1]);
          NODE
          node --check /tmp/lovena-export.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4