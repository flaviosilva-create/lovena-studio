name: Deploy Lovena Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate landing page and language selector
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          inline_scripts = re.findall(r"<script>\s*(.*?)\s*</script>", html, re.S)
          if len(inline_scripts) != 2:
              raise SystemExit(f"Expected the GTranslate configuration and asynchronous loader scripts, found {len(inline_scripts)}")
          config_script = next((script for script in inline_scripts if "window.gtranslateSettings" in script), "")
          loader_script = next((script for script in inline_scripts if "function loadLovenaTranslator()" in script), "")
          if not config_script or not loader_script or "function openStudio()" in html:
              raise SystemExit("The landing page must contain only the expected translation configuration and loader scripts")
          Path("/tmp/lovena-gtranslate-config.js").write_text(config_script, encoding="utf-8")
          Path("/tmp/lovena-gtranslate-loader.js").write_text(loader_script, encoding="utf-8")
          for marker in ['id="lovenaPreferences"', 'id="lovenaLanguageSelect"', 'id="lovenaCurrencySelect"', '<option value="brl" hidden disabled style="display:none">🇧🇷 BRL · R$</option>', '<option value="eur">🇪🇺 EUR · €</option>']:
              if marker not in html:
                  raise SystemExit(f"Landing page is missing the visible language/currency control: {marker}")
          visible_preferences_css = html.split('<style id="lovena-visible-preferences">', 1)[-1].split("</style>", 1)[0]
          for marker in ["#lovenaPreferences{display:flex!important", "#lovenaCurrencySelect{display:inline-block!important"]:
              if marker not in visible_preferences_css:
                  raise SystemExit(f"Landing language/currency controls lack their visibility rule: {marker}")
          region = Path("assets/lovena-region.js").read_text(encoding="utf-8")
          for marker in ['function setCurrencyPreference(currency)', 'selector.addEventListener("change"', 'localStorage.setItem(CURRENCY_KEY, value)', 'function applyPrices(currency)', 'function updateBRLAvailability(isBrazil)', 'LOVENA_CAN_USE_BRL', 'applyCountry(country, true)', 'eur: {', 'simple: "€ 4,99"', 'premium: "€ 9,99"', 'addon: "€ 1,00"']:
              if marker not in region:
                  raise SystemExit(f"Currency selector is missing its behavior: {marker}")
          for marker in ['id="lr-main"', 'id="lr-footer"', 'class="lr-hero"', 'id="top"']:
              if marker not in html:
                  raise SystemExit(f"Landing page is missing required structure: {marker}")
          # Keep prices explicitly in USD when browser translation is enabled.
          for price_markup in [
              '<div class="lr-price notranslate" translate="no" lang="en-US" aria-label="4.99 US dollars">$4.99</div>',
              '<div class="lr-price notranslate" translate="no" lang="en-US" aria-label="9.99 US dollars">$9.99</div>',
          ]:
              if price_markup not in html:
                  raise SystemExit(f"Pricing must remain untranslated in USD: {price_markup}")
          if html.count('class="notranslate" translate="no" lang="en-US">$1.00</span>') != 2:
              raise SystemExit("Both optional HTML download fees must remain displayed in USD")
          if not re.search(r'href="./landing\.css\?v=[^"]+"', html):
              raise SystemExit("The landing page stylesheet must remain linked with a cache-busting version")
          if 'default_language: "en"' not in html:
              raise SystemExit("Lovena source language must remain English")
          if html.count("https://cdn.gtranslate.net/widgets/latest/dropdown.js") != 1:
              raise SystemExit("Expected exactly one GTranslate widget")
          if "google_translate_element" in html or "translate.google.com/translate_a/element.js" in html:
              raise SystemExit("Legacy Google Translate widget must not be loaded alongside GTranslate")
          if "translation-bridge.js" not in html:
              raise SystemExit("The existing language-selector support must remain loaded")
          if 'id="studioOverlay"' in html or 'id="readerOverlay"' in html or "function openStudio()" in html:
              raise SystemExit("The removed creator/recipient experience must not be reintroduced")
          bridge = Path("translation-bridge.js").read_text(encoding="utf-8")
          if 'window.addEventListener("lovena:experience-language-changed"' in bridge:
              raise SystemExit("Gift content locale must not override the selected interface language")
          language_ui = Path("assets/lovena-experience-language.js").read_text(encoding="utf-8")
          for required_ui in [
              'lovenaPreferredLanguage',
              'lovenaManualLanguage',
              'query.get("edit") === "1" && !query.get("slug")',
              'control.hidden = !isEditing',
              'lovena:interface-language-changed'
          ]:
              if required_ui not in language_ui:
                  raise SystemExit(f"Experience interface-language selector is missing behavior: {required_ui}")
          for required in [
              'var CACHE_KEY = "lovenaDynamicTranslationCacheV3";',
              'return selectors.find(isElementVisible) || selectors[0] || null;',
              "function clearGoogleTranslateCookies()",
              "function scheduleTranslation(delay, keepExisting)",
              "function parseBatchTranslationResponse(data, expectedCount)",
              "function createTranslationBatches(sources)",
              "if (document.body) allRoots.push(document.body)",
              "await Promise.all(Array.from({ length: Math.min(3, batches.length) }, worker));",
              "function ensureEnglishOption(selector)",
              'english.value = SOURCE_LANGUAGE + "|" + SOURCE_LANGUAGE;',
              'if (!parts.length) return "";',
              "if (language === SOURCE_LANGUAGE)",
              '"You make": "Você torna"',
              '"everything more beautiful": "tudo mais bonito"',
              "translate.googleapis.com/translate_a/t",
              '#lovenaExperienceLanguageSelect',
              'lovenaExperienceLanguageControl',
              'lovenaPublicationPanel',
              'experiencePickerChanged',
              'persistentUiRoots',
              'if (first === SOURCE_LANGUAGE.toLowerCase()) lang = parts[parts.length - 1];'
          ]:
              if required not in bridge:
                  raise SystemExit(f"Language-selector validation failed: missing {required}")
          for public_path in ("experience.html", "experience-simple.html"):
              public_html = Path(public_path).read_text(encoding="utf-8")
              if re.search(r"await\s*\(\s*window\.LovenaBackend\s*\?\s*window\.LovenaBackend\.ready", public_html):
                  raise SystemExit(f"{public_path} must not gate public interactions on Supabase auth startup")
              if "getPublicExperience(shareSlug)" not in public_html:
                  raise SystemExit(f"{public_path} is missing public experience loading")
              for marker in [
                  'id="lovena-visual-hydration"',
                  'html:not(.lovena-visuals-ready) #fotos .gallery-photo',
                  'function revealPersonalizedVisualsAfterHydration()',
                  'revealPersonalizedVisualsAfterHydration();',
                  'root.classList.add("lovena-visuals-ready")',
                  'id="lovenaExperienceLanguageControl" data-editor-only hidden',
                  'id="lovenaExperienceLanguageSelect"',
                  'assets/lovena-experience-language.js?v=20261028-experience-language-3',
                  'translation-bridge.js?v=20261029-pt-headline-1'
              ]:
                  if marker not in public_html:
                      raise SystemExit(f"{public_path} is missing editor-only interface-language support: {marker}")
              if 'clone.querySelectorAll("[data-editor-only]' not in public_html:
                  raise SystemExit(f"{public_path} must remove the interface-language selector from downloaded HTML exports")
              if "script[src*='lovena-experience-language.js']" not in public_html:
                  raise SystemExit(f"{public_path} must remove the interface-language script from downloaded HTML exports")
          backend = Path("assets/lovena-backend.js").read_text(encoding="utf-8")
          if "public experiences remain interactive." not in backend:
              raise SystemExit("Backend initialization failure must not prevent public experiences from rendering")
          for required in [
              'function storedSnapshotKey(editorKey)',
              'preserveStoredMediaReferences',
              'syncPublishedExperience(supabase, "load-published"',
              'syncPublishedExperience(supabase, "save-published"',
              'published: true',
              'The same shared link will show the latest saved version'
          ]:
              if required not in backend:
                  raise SystemExit(f"Post-payment editing validation failed: missing {required}")
          for public_path in ("experience.html", "experience-simple.html"):
              public_html = Path(public_path).read_text(encoding="utf-8")
              if not re.search(r'assets/lovena-backend\.js\?v=[^"]+', public_html):
                  raise SystemExit(f"{public_path} must load the backend with a cache-busting version")
              for marker in [
                  'var LETTER_BODY_MAX_CHARS=1500;',
                  'key:"letterBody",label:"Letter Text",group:"Love Letter"',
                  'ctl.maxLength=LETTER_BODY_MAX_CHARS;',
                  'letterCountText.nodeValue=length+" / "+LETTER_BODY_MAX_CHARS;',
                  'function limitLetterBody(value)',
                  '.ed-letter-meta.is-at-limit output'
              ]:
                  if marker not in public_html:
                      raise SystemExit(f"{public_path} is missing the single-letter 1,500-character limit: {marker}")
              if re.search(r'key:"letterCopy[0-3]",label:"Paragraph [1-4]"', public_html):
                  raise SystemExit(f"{public_path} must use one field for the entire letter, not separate paragraph fields")

          experience = Path("experience.html").read_text(encoding="utf-8")
          experience_scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>\s*(.*?)\s*</script>', experience, re.S)
          if len(experience_scripts) != 3:
              raise SystemExit(f"Expected 3 experience scripts, found {len(experience_scripts)}")
          for marker in [
              'id="lovenaEditBootstrap"',
              'id="lovenaEditorRuntime"',
              'id="lovenaEditorStyles"',
              'data-editor-action="export"',
              'localStorage.setItem(EDIT_KEY,JSON.stringify(getSnapshot()))',
              'createImageBitmap(file,{resizeWidth:maxDimension,resizeQuality:"high"})',
              'canvas.toBlob(function(blob)',
              'if(typeof window.createImageBitmap!=="function")',
              'data-editor-action="add-photo"',
              'data-editor-action="add-milestone"',
              'id="detailModal"',
              'id="fotos"',
              'id="historia"',
              'id="surpresas"'
          ]:
              if marker not in experience:
                  raise SystemExit(f"Editable experience is missing required feature: {marker}")
          for index, script in enumerate(experience_scripts):
              Path(f"/tmp/lovena-experience-{index}.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/lovena-gtranslate-config.js
          node --check /tmp/lovena-gtranslate-loader.js
          node --check translation-bridge.js
          node --check assets/lovena-backend.js
          node --check assets/lovena-public-interactions.js
          node --check assets/lovena-experience-language.js
          node --check /tmp/lovena-experience-0.js
          node --check /tmp/lovena-experience-1.js
          node --check /tmp/lovena-experience-2.js
          node <<'NODE'
          const fs = require("fs");
          const bridge = fs.readFileSync("translation-bridge.js", "utf8");
          const start = bridge.indexOf("  function canonicalLanguage(value) {");
          const end = bridge.indexOf("\n  function readSavedLanguage", start);
          if (start < 0 || end < 0) throw new Error("Could not extract GTranslate language parser");
          const parserSource = bridge.slice(start, end).replace("  function canonicalLanguage(value)", "return function canonicalLanguage(value)");
          const parseLanguage = new Function("SOURCE_LANGUAGE", parserSource) ("en");
          const cases = [["en|pt","pt"],["en|es","es"],["en|en","en"],["pt|en","pt"],["fr","fr"],["",""]];
          for (const [input, expected] of cases) {
            const actual = parseLanguage(input);
            if (actual !== expected) throw new Error(input + " parsed as " + actual + ", expected " + expected);
          }
          console.log("GTranslate language-value tests passed.");
          NODE
      - name: Smoke test keyless batch translation endpoint (non-blocking)
        continue-on-error: true
        run: |
          node <<'NODE'
          (async () => {
            const url = new URL("https://translate.googleapis.com/translate_a/t");
            url.searchParams.set("client", "gtx");
            url.searchParams.set("sl", "en");
            url.searchParams.set("tl", "pt");
            const batchTexts = ["How are you today?", "The story of our love"];
            batchTexts.forEach(text => url.searchParams.append("q", text));
            try {
              const origin = "https://flaviosilva-create.github.io";
              const response = await fetch(url, { headers: { "Accept": "application/json", "Origin": origin } });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const allowOrigin = response.headers.get("access-control-allow-origin");
              if (allowOrigin !== "*" && allowOrigin !== origin) throw new Error("CORS does not allow the Lovena origin (header: " + allowOrigin + ")");
              const data = await response.json();
              const translated = Array.isArray(data) ? data.map(item => Array.isArray(item) ? String(item[0] || "") : "").filter(Boolean) : [];
              if (translated.length !== batchTexts.length || translated.some((text, index) => !text || text === batchTexts[index])) throw new Error("Batch endpoint did not translate every input: " + JSON.stringify(data));
              console.log("Keyless batch translation endpoint passed: " + translated.join(" | "));
            } catch (error) {
              console.log("Keyless batch translation endpoint failed: " + error.message);
              process.exitCode = 1;
            }
          })();
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Browser smoke test for public Premium interactions
        env:
          PUBLIC_EXPERIENCE_URL: https://flaviosilva-create.github.io/lovena-studio/experience.html?slug=774245ba57f646788158&v=20261028-no-photo-flash-1
          EDITOR_EXPERIENCE_URL: https://flaviosilva-create.github.io/lovena-studio/experience.html?edit=1&ui=20261028-no-photo-flash-1
          EDITOR_SIMPLE_URL: https://flaviosilva-create.github.io/lovena-studio/experience-simple.html?edit=1&ui=20261029-letter-limit-1
          DEMO_PREMIUM_URL: https://flaviosilva-create.github.io/lovena-studio/experience.html?demo=1&v=20261029-demo-music-1
          DEMO_SIMPLE_URL: https://flaviosilva-create.github.io/lovena-studio/experience-simple.html?demo=1&v=20261029-demo-music-1
        run: |
          npm install --prefix /tmp/lovena-smoke playwright
          /tmp/lovena-smoke/node_modules/.bin/playwright install --with-deps chromium webkit
          NODE_PATH=/tmp/lovena-smoke/node_modules node <<'NODE'
          const { chromium, webkit } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            const pageErrors = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            // Validate the actual deployed landing page in desktop and mobile viewports.
            async function verifyLandingCurrency(width, label, countryCode) {
              const landing = await browser.newPage({ viewport: { width, height: width <= 500 ? 844 : 900 } });
              landing.on("pageerror", error => pageErrors.push(error.message));
              // Isolate geolocation so the test proves the policy for Brazil and for another country.
              await landing.route("https://ipapi.co/json/", route => route.fulfill({
                status: 200,
                contentType: "application/json",
                headers: { "access-control-allow-origin": "*" },
                body: JSON.stringify({ country_code: countryCode })
              }));
              await landing.goto("https://flaviosilva-create.github.io/lovena-studio/?currency-smoke=" + label, {
                waitUntil: "domcontentloaded",
                timeout: 60000
              });
              await landing.waitForFunction(country => window.LOVENA_REGION_VERIFIED === true &&
                window.LOVENA_REGION_COUNTRY === country, countryCode, { timeout: 15000 });
              if (countryCode !== "BR") {
                // Simulate a visitor arriving with an old saved BRL preference from Brazil.
                await landing.evaluate(() => localStorage.setItem("lovenaPreferredCurrency", "brl"));
                await landing.reload({ waitUntil: "domcontentloaded" });
                await landing.waitForFunction(country => window.LOVENA_REGION_VERIFIED === true &&
                  window.LOVENA_REGION_COUNTRY === country, countryCode, { timeout: 15000 });
              }
              const state = await landing.evaluate(() => {
                const option = document.querySelector('#lovenaCurrencySelect option[value="brl"]');
                return {
                  barVisible: !!document.getElementById("lovenaPreferences") &&
                    getComputedStyle(document.getElementById("lovenaPreferences")).display !== "none",
                  optionExists: !!option,
                  optionHidden: !!option?.hidden || getComputedStyle(option).display === "none",
                  optionDisabled: !!option?.disabled,
                  canUseBRL: window.LOVENA_CAN_USE_BRL === true,
                  currency: document.getElementById("lovenaCurrencySelect")?.value,
                  saved: localStorage.getItem("lovenaPreferredCurrency")
                };
              });
              if (!state.barVisible || !state.optionExists) {
                throw new Error("Landing currency controls are not available on " + label + ": " + JSON.stringify(state));
              }
              if (countryCode === "BR") {
                if (state.optionHidden || state.optionDisabled || !state.canUseBRL || state.currency !== "brl") {
                  throw new Error("Brazil should see BRL selected and available on " + label + ": " + JSON.stringify(state));
                }
                await landing.waitForFunction(() =>
                  document.querySelector("#plans .lr-plan-basic .lr-price")?.textContent.trim() === "R$ 9,99" &&
                  document.querySelector("#plans .lr-plan-featured .lr-price")?.textContent.trim() === "R$ 19,99",
                  null, { timeout: 10000 }
                );
              } else {
                if (!state.optionHidden || !state.optionDisabled || state.canUseBRL || state.currency === "brl") {
                  throw new Error("BRL must be hidden for non-Brazil visitors even with an old saved BRL preference on " + label + ": " + JSON.stringify(state));
                }
                await landing.waitForFunction(() =>
                  document.querySelector("#plans .lr-plan-basic .lr-price")?.textContent.trim() === "US$ 4.99" &&
                  document.querySelector("#plans .lr-plan-featured .lr-price")?.textContent.trim() === "US$ 9.99",
                  null, { timeout: 10000 }
                );
              }
              await landing.locator("#lovenaCurrencySelect").selectOption("usd");
              await landing.waitForFunction(() =>
                window.LOVENA_CURRENCY_CODE === "usd" &&
                document.querySelector("#plans .lr-plan-basic .lr-price")?.textContent.trim() === "US$ 4.99" &&
                document.querySelector("#plans .lr-plan-featured .lr-price")?.textContent.trim() === "US$ 9.99",
                null, { timeout: 10000 }
              );
              await landing.locator("#lovenaCurrencySelect").selectOption("eur");
              await landing.waitForFunction(() =>
                window.LOVENA_CURRENCY_CODE === "eur" &&
                localStorage.getItem("lovenaPreferredCurrency") === "eur" &&
                document.querySelector("#plans .lr-plan-basic .lr-price")?.textContent.trim() === "€ 4,99" &&
                document.querySelector("#plans .lr-plan-featured .lr-price")?.textContent.trim() === "€ 9,99" &&
                document.querySelector("#plans .lr-plan-basic li span.notranslate")?.textContent.trim() === "€ 1,00",
                null, { timeout: 10000 }
              );
              await landing.reload({ waitUntil: "domcontentloaded" });
              await landing.waitForFunction(country => window.LOVENA_REGION_VERIFIED === true &&
                window.LOVENA_REGION_COUNTRY === country &&
                window.LOVENA_CURRENCY_CODE === "eur" &&
                document.getElementById("lovenaCurrencySelect")?.value === "eur" &&
                document.querySelector("#plans .lr-plan-basic .lr-price")?.textContent.trim() === "€ 4,99" &&
                document.querySelector("#plans .lr-plan-featured .lr-price")?.textContent.trim() === "€ 9,99" &&
                (country === "BR" ||
                  (document.querySelector('#lovenaCurrencySelect option[value="brl"]')?.hidden === true &&
                   document.querySelector('#lovenaCurrencySelect option[value="brl"]')?.disabled === true)),
                countryCode, { timeout: 15000 }
              );
              console.log("BRL is " + (countryCode === "BR" ? "available only in Brazil" : "hidden outside Brazil") +
                "; USD/EUR pricing and saved EUR preference passed on " + label + ".");
              await landing.close();
            }
            await verifyLandingCurrency(1365, "desktop-brazil", "BR");
            await verifyLandingCurrency(390, "mobile-germany", "DE");

            // Test the two live examples separately from the editor and customer's saved draft.
            async function verifyLiveDemo(url, label, expectMusic) {
              const demoPage = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const demoErrors = [];
              demoPage.on("pageerror", error => demoErrors.push(error.message));
              await demoPage.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
              await demoPage.waitForFunction(() =>
                window.LOVENA_EDIT_DATA &&
                document.querySelector("#galleryRow")?.dataset.galleryAutoplayController === "unified",
                null, { timeout: 20000 });
              const state = await demoPage.evaluate(() => ({
                editorMode: document.body.classList.contains("editor-mode"),
                hasPhotos: Array.isArray(window.LOVENA_EDIT_DATA?.photos) && window.LOVENA_EDIT_DATA.photos.length > 0,
                hasTitle: !!document.querySelector(".hero-title, .hero h1, h1"),
                hasEditPanel: !!document.querySelector("#lovenaEditor.is-open")
              }));
              if (state.editorMode || state.hasEditPanel || !state.hasPhotos || !state.hasTitle) {
                throw new Error(label + " did not load as a clean, interactive sample: " + JSON.stringify(state));
              }
              await demoPage.locator('#galleryRow .gallery-item[data-photo="0"]:not([data-gallery-clone="true"])').click({ timeout: 10000 });
              await demoPage.locator("#detailModal[open]").waitFor({ timeout: 5000 });
              await demoPage.locator('[data-action="close-modal"]').click();

              if (expectMusic) {
                await demoPage.waitForFunction(() =>
                  window.LOVENA_EDIT_DATA?.songs?.[0]?.url?.includes("GnUW4AF1LZo"),
                  null, { timeout: 10000 });
                await demoPage.locator('[data-action="song-play"]').click({ timeout: 10000 });
                const frame = demoPage.locator("#musicEmbedContainer iframe");
                await frame.waitFor({ state: "attached", timeout: 10000 });
                const playerSrc = await frame.getAttribute("src");
                if (!playerSrc || !playerSrc.includes("/embed/GnUW4AF1LZo")) {
                  throw new Error("Premium demo player did not embed the requested YouTube Music video: " + playerSrc);
                }
                for (const selector of ['[data-surprise="card"]', '[data-surprise="message"]', '[data-milestone="0"]']) {
                  await demoPage.locator(selector).click({ timeout: 10000 });
                  await demoPage.locator("#detailModal[open]").waitFor({ timeout: 5000 });
                  await demoPage.locator('[data-action="close-modal"]').click();
                }
                console.log("Premium live demo passed: gallery, story, surprises, and in-page YouTube player.");
              } else {
                console.log("Simple live demo passed: gallery photo opens and closes.");
              }
              if (demoErrors.length) throw new Error(label + " JavaScript errors: " + demoErrors.join(" | "));
              await demoPage.close();
            }
            await verifyLiveDemo(process.env.DEMO_SIMPLE_URL, "Simple demo", false);
            await verifyLiveDemo(process.env.DEMO_PREMIUM_URL, "Premium demo", true);

            await page.goto(process.env.PUBLIC_EXPERIENCE_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForFunction(() => document.querySelector("#lovenaExperienceLanguageControl")?.dataset.languageControlReady === "true", null, { timeout: 15000 });
            if (await page.locator("#lovenaExperienceLanguageControl").isVisible()) {
              throw new Error("The interface-language selector must not appear on a shared/public experience.");
            }
            // Do not wait for the Supabase data request: this test must verify that public controls still work even if that request stalls.
            await page.waitForFunction(() => window.LOVENA_EDIT_DEFAULTS && document.querySelector('script[src*="lovena-public-interactions.js"]'), null, { timeout: 15000 });
            async function verifyGalleryAutoplay(targetPage, label) {
              await targetPage.waitForFunction(() => document.documentElement.classList.contains("lovena-visuals-ready"), null, { timeout: 10000 });
              await targetPage.waitForFunction(() => document.querySelector("#galleryRow")?.dataset.galleryAutoplayController === "unified", null, { timeout: 10000 });
              await targetPage.locator("#galleryRow").scrollIntoViewIfNeeded();
              await targetPage.waitForTimeout(350);
              const before = await targetPage.locator("#galleryRow").evaluate(row => ({
                scrollLeft: row.scrollLeft,
                loopWidth: row.querySelector('.gallery-item[data-gallery-clone="true"]').getBoundingClientRect().left -
                  row.querySelector('.gallery-item:not([data-gallery-clone="true"])').getBoundingClientRect().left,
                maxScroll: row.scrollWidth - row.clientWidth,
                cloneOpacity: getComputedStyle(row.querySelector('.gallery-item[data-gallery-clone="true"]')).opacity
              }));
              if (label.includes("desktop")) {
                const rect = await targetPage.locator("#galleryRow").boundingBox();
                await targetPage.mouse.move(rect.x + rect.width / 2, rect.y + rect.height / 2);
              }
              await targetPage.waitForTimeout(1800);
              const after = await targetPage.locator("#galleryRow").evaluate(row => row.scrollLeft);
              if (!(after > before.scrollLeft)) {
                throw new Error(`Our Moments autoplay did not advance on ${label}: scrollLeft ${before.scrollLeft} -> ${after}`);
              }
              await targetPage.waitForTimeout(1800);
              const later = await targetPage.locator("#galleryRow").evaluate(row => row.scrollLeft);
              if (!(later > after)) {
                throw new Error(`Our Moments autoplay stalled after the first movement on ${label}: ${after} -> ${later}`);
              }
              if (before.maxScroll + 2 < before.loopWidth) {
                throw new Error(`Our Moments loop has insufficient cloned width on ${label}: max scroll ${before.maxScroll}, loop width ${before.loopWidth}`);
              }
              if (before.cloneOpacity === "0") {
                throw new Error(`Our Moments duplicate cards are hidden on ${label}`);
              }
              console.log(`Our Moments autoplay passed on ${label}: ${before.scrollLeft} -> ${after}px`);
            }
            await verifyGalleryAutoplay(page, "desktop");
            const mobilePage = await browser.newPage({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              reducedMotion: "reduce"
            });
            mobilePage.on("pageerror", error => pageErrors.push(error.message));
            await mobilePage.goto(process.env.PUBLIC_EXPERIENCE_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
            await verifyGalleryAutoplay(mobilePage, "mobile");
            await mobilePage.close();

            // Reproduce the actual editor mode, where the owner sees the gallery behind the editing/publishing panel.
            const editorPage = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            editorPage.on("pageerror", error => pageErrors.push(error.message));
            editorPage.on("console", message => { if (message.type() === "warning" || message.type() === "error") console.log("Editor console [" + message.type() + "]: " + message.text()); });
            let translationRequests = 0;
            await editorPage.route(/https:\/\/translate\.googleapis\.com\/translate_a\/(?:single|t).*/, async route => {
              translationRequests++;
              const requestUrl = new URL(route.request().url());
              const language = requestUrl.searchParams.get("tl") || "pt";
              const sources = requestUrl.searchParams.getAll("q");
              const payload = sources.map(source => [language + ": " + source, "en"]);
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                headers: { "access-control-allow-origin": "*" },
                body: JSON.stringify(payload)
              });
            });
            await editorPage.addInitScript(() => localStorage.setItem("lovenaPreferredLanguage", "pt"));
            await editorPage.goto(process.env.EDITOR_EXPERIENCE_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
            await editorPage.waitForFunction(() =>
              document.body.classList.contains("editor-mode") &&
              document.querySelector("#galleryRow")?.dataset.galleryAutoplayController === "unified",
              null, { timeout: 20000 });

            async function verifyLetterLimit(targetPage, label) {
              const field = targetPage.locator('[data-editor-field="letterBody"]');
              await targetPage.waitForFunction(() => {
                const input = document.querySelector('[data-editor-field="letterBody"]');
                return input instanceof HTMLTextAreaElement && input.maxLength === 1500 &&
                  document.querySelector(".ed-letter-meta output") !== null;
              }, null, { timeout: 15000 });
              const original = (await field.inputValue()).slice(0, 1500);
              await field.fill("a".repeat(1499));
              await targetPage.waitForFunction(() =>
                document.querySelector('[data-editor-field="letterBody"]')?.value.length === 1499 &&
                document.querySelector(".ed-letter-meta output")?.textContent.trim() === "1499 / 1500",
                null, { timeout: 10000 });
              await field.fill("b".repeat(1800));
              await targetPage.waitForFunction(() =>
                document.querySelector('[data-editor-field="letterBody"]')?.value.length === 1500 &&
                document.querySelector(".ed-letter-meta output")?.textContent.trim() === "1500 / 1500",
                null, { timeout: 10000 });
              await field.fill(original);
              await targetPage.waitForFunction(() => {
                const input = document.querySelector('[data-editor-field="letterBody"]');
                return input && input.value.length <= 1500 &&
                  document.querySelector(".ed-letter-meta output")?.textContent.trim() === input.value.length + " / 1500";
              }, null, { timeout: 10000 });
              console.log("Letter character limit and counter passed on " + label + ".");
            }
            await verifyLetterLimit(editorPage, "Premium");

            const simpleContext = await browser.newContext({ viewport: { width: 1365, height: 900 } });
            const simpleEditorPage = await simpleContext.newPage();
            simpleEditorPage.on("pageerror", error => pageErrors.push("Simple editor: " + error.message));
            await simpleEditorPage.goto(process.env.EDITOR_SIMPLE_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
            await simpleEditorPage.waitForFunction(() =>
              document.body.classList.contains("editor-mode") &&
              document.querySelector("#galleryRow")?.dataset.galleryAutoplayController === "unified",
              null, { timeout: 20000 });
            await verifyLetterLimit(simpleEditorPage, "Simple");
            await simpleContext.close();

            async function verifyEditorCloseButton(targetPage, label) {
              const close = targetPage.locator("#lovenaEditorMobileClose");
              async function waitForVisibleClose() {
                await targetPage.waitForFunction(() => {
                  const button = document.querySelector("#lovenaEditorMobileClose");
                  if (!button || button.hidden || !document.body.classList.contains("editor-panel-open")) return false;
                  const style = getComputedStyle(button);
                  const rect = button.getBoundingClientRect();
                  return style.display !== "none" && style.visibility === "visible" &&
                    Number(style.opacity) > 0 && rect.width >= 44 && rect.height >= 44;
                }, null, { timeout: 10000 });
              }
              await waitForVisibleClose();
              await close.click();
              await targetPage.waitForFunction(() => {
                const button = document.querySelector("#lovenaEditorMobileClose");
                return button && button.hidden && !document.body.classList.contains("editor-panel-open");
              }, null, { timeout: 10000 });
              await targetPage.locator("#lovenaEditorTrigger").click({ force: true });
              await waitForVisibleClose();
              if (label === "desktop") {
                const viewport = targetPage.viewportSize();
                await targetPage.setViewportSize({ width: 520, height: viewport.height });
                await waitForVisibleClose();
                await targetPage.setViewportSize(viewport);
                await waitForVisibleClose();
              }
              console.log("Editor close X remained visible and closed/reopened the panel on " + label + ".");
            }
            await verifyEditorCloseButton(editorPage, "desktop");
            await editorPage.waitForFunction(() => {
              const control = document.querySelector("#lovenaExperienceLanguageControl");
              const selector = document.querySelector("#lovenaExperienceLanguageSelect");
              return control?.dataset.languageControlReady === "true" && !control.hidden && selector?.value === "pt";
            }, null, { timeout: 15000 });
            await editorPage.waitForFunction(() =>
              window.LovenaTranslationBridge?.language() === "pt",
              null, { timeout: 10000 });
            await editorPage.evaluate(() => {
              const editor = document.querySelector("#lovenaEditor");
              if (!editor || !window.LovenaTranslationBridge) throw new Error("Editor translation bridge is unavailable.");
              const probe = document.createElement("span");
              probe.id = "lovenaInterfaceLanguageProbe";
              probe.setAttribute("data-editor-only", "");
              probe.style.display = "none";
              probe.textContent = "Interface language translation probe";
              editor.insertBefore(probe, editor.firstChild);
              window.LovenaTranslationBridge.refresh();
            });
            try {
              await editorPage.waitForFunction(() =>
                document.querySelector("#lovenaInterfaceLanguageProbe")?.textContent === "pt: Interface language translation probe",
                null, { timeout: 20000 });
            } catch (error) {
              const diagnostic = await editorPage.evaluate(() => {
                const probe = document.querySelector("#lovenaInterfaceLanguageProbe");
                const editor = document.querySelector("#lovenaEditor");
                const selector = document.querySelector("#lovenaExperienceLanguageSelect");
                return {
                  probeExists: !!probe,
                  probeText: probe?.textContent || null,
                  probeParent: probe?.parentElement?.tagName || null,
                  probeUserAuthored: !!probe?.closest('[data-lovena-user-content="true"]'),
                  editorConnected: !!editor?.isConnected,
                  editorHidden: !!editor?.hidden,
                  editorAriaHidden: editor?.getAttribute("aria-hidden") || null,
                  firstEditorText: editor?.firstElementChild?.textContent?.trim()?.slice(0, 100) || null,
                  selectorValue: selector?.value || null,
                  bridgeLanguage: window.LovenaTranslationBridge?.language() || null,
                  activeLanguage: document.documentElement.lang || null
                };
              });
              console.error("Interface translation diagnostics:", JSON.stringify({ ...diagnostic, translationRequests }));
              throw error;
            }
            console.log("Experience interface inherited Portuguese and translated editor content.");
            await editorPage.waitForFunction(() => {
              const heading = document.querySelector("#hero-title");
              return heading && heading.innerText.replace(/\s+/g, " ").trim() === "Você torna tudo mais bonito";
            }, null, { timeout: 20000 });
            console.log("Portuguese headline override passed: Você torna tudo mais bonito.");
            await editorPage.locator("#lovenaExperienceLanguageSelect").selectOption("de");
            await editorPage.waitForFunction(() =>
              localStorage.getItem("lovenaPreferredLanguage") === "de" &&
              window.LovenaTranslationBridge?.language() === "de" &&
              document.querySelector("#lovenaInterfaceLanguageProbe")?.textContent === "de: Interface language translation probe",
              null, { timeout: 30000 });
            console.log("Experience language selector changed and persisted the editor interface language.");
            await verifyGalleryAutoplay(editorPage, "editor desktop");
            async function verifyPreviewInteractions(targetPage, label) {
              // The edit URL opens the editing mode but leaves the drawer closed.
              // Open it before targeting the Preview Experience action.
              await targetPage.locator("#lovenaEditorTrigger").click({ force: true });
              await targetPage.waitForFunction(() => document.body.classList.contains("editor-panel-open"), null, { timeout: 10000 });
              await targetPage.locator('[data-editor-action="view"]').scrollIntoViewIfNeeded();
              await targetPage.locator('[data-editor-action="view"]').evaluate(button => button.click());
              await targetPage.waitForFunction(() => document.body.classList.contains("lovena-preview-mode"), null, { timeout: 10000 });

              await targetPage.locator('#galleryRow .gallery-item[data-photo="0"]:not([data-gallery-clone="true"])').click({ timeout: 10000 });
              await targetPage.locator("#detailModal[open]").waitFor({ timeout: 5000 });
              await targetPage.locator('[data-action="close-modal"]').click();

              for (const kind of ["card", "message"]) {
                await targetPage.locator('[data-surprise="' + kind + '"]').click({ timeout: 10000 });
                await targetPage.locator("#detailModal[open]").waitFor({ timeout: 5000 });
                await targetPage.locator('[data-action="close-modal"]').click();
              }

              await targetPage.locator('[data-milestone="0"]').click({ timeout: 10000 });
              await targetPage.locator("#detailModal[open]").waitFor({ timeout: 5000 });
              await targetPage.locator('[data-action="close-modal"]').click();

              await targetPage.locator("#lovenaEditorTrigger").click();
              await targetPage.waitForFunction(() => document.body.classList.contains("editor-mode") &&
                document.body.classList.contains("editor-panel-open"), null, { timeout: 10000 });
              console.log("Preview interactions passed on " + label + ": photo, card, message, story milestone.");
            }
            await verifyPreviewInteractions(editorPage, "desktop");

            async function verifyAutoplayBehindPublishPanel(targetPage, label) {
              await targetPage.locator("#lovenaPublishExportTrigger").waitFor({ state: "visible", timeout: 20000 });
              await targetPage.locator("#lovenaPublishExportTrigger").click();
              await targetPage.waitForFunction(() => {
                const panel = document.querySelector("#lovenaPublicationPanel");
                return panel && !panel.hidden && panel.getAttribute("aria-hidden") === "false";
              }, null, { timeout: 10000 });
              await targetPage.waitForTimeout(350);
              const before = await targetPage.locator("#galleryRow").evaluate(row => row.scrollLeft);
              await targetPage.waitForTimeout(1800);
              const after = await targetPage.locator("#galleryRow").evaluate(row => row.scrollLeft);
              if (!(after > before)) {
                throw new Error(`Our Moments stopped behind Publish & Pay on ${label}: scrollLeft ${before} -> ${after}`);
              }
              console.log(`Our Moments continued behind Publish & Pay on ${label}: ${before} -> ${after}px`);
            }
            await verifyAutoplayBehindPublishPanel(editorPage, "desktop");
            await editorPage.close();

            // WebKit is the closest automated engine check for the iPhone Safari issue.
            const webkitBrowser = await webkit.launch({ headless: true });
            const editorMobileContext = await webkitBrowser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              hasTouch: true,
              reducedMotion: "reduce"
            });
            const editorMobilePage = await editorMobileContext.newPage();
            editorMobilePage.on("pageerror", error => pageErrors.push(error.message));
            await editorMobilePage.goto(process.env.EDITOR_EXPERIENCE_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
            await editorMobilePage.waitForFunction(() =>
              document.body.classList.contains("editor-mode") &&
              document.querySelector("#galleryRow")?.dataset.galleryAutoplayController === "unified",
              null, { timeout: 20000 });
            await verifyEditorCloseButton(editorMobilePage, "WebKit iPhone-sized viewport");
            await verifyGalleryAutoplay(editorMobilePage, "WebKit editor mobile");
            await verifyPreviewInteractions(editorMobilePage, "WebKit iPhone-sized viewport");
            await verifyAutoplayBehindPublishPanel(editorMobilePage, "WebKit iPhone-sized viewport");
            await webkitBrowser.close();

            await page.locator('#galleryRow .gallery-item[data-photo="0"]:not([data-gallery-clone="true"])').click({ timeout: 15000 });
            await page.locator("#detailModal[open]").waitFor({ timeout: 5000 });
            await page.locator('[data-action="close-modal"]').click();
            await page.locator('[data-surprise="card"]').click({ timeout: 10000 });
            await page.locator("#detailModal[open]").waitFor({ timeout: 5000 });
            await page.locator('[data-action="close-modal"]').click();
            await page.locator('[data-milestone="0"]').click({ timeout: 10000 });
            await page.locator("#detailModal[open]").waitFor({ timeout: 5000 });
            if (pageErrors.length) throw new Error("Browser JavaScript errors: " + pageErrors.join(" | "));
            console.log("Public Premium interactions passed: gallery photo, surprise card, and story milestone.");
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
