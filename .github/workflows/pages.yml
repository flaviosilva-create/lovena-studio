name: Deploy Lovena Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>\s*(.*?)\s*</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          if 'default_language: "en"' not in html:
              raise SystemExit("Lovena source language must remain English")
          if html.count("https://cdn.gtranslate.net/widgets/latest/dropdown.js") != 1:
              raise SystemExit("Expected exactly one GTranslate widget")
          if "google_translate_element" in html or "translate.google.com/translate_a/element.js" in html:
              raise SystemExit("Legacy Google Translate widget must not be loaded alongside GTranslate")
          for element_id in ["studioOverlay", "readerOverlay", "studioToast", "loveWorldHeadingCopy"]:
              if f'id="{element_id}"' not in html:
                  raise SystemExit(f"Missing dynamic translation root: {element_id}")
          bridge = Path("translation-bridge.js").read_text(encoding="utf-8")
          if 'var CACHE_KEY = "lovenaDynamicTranslationCacheV3";' not in bridge:
              raise SystemExit("Mobile-safe translation cache version is missing")
          if "return selectors.find(isElementVisible) || selectors[0] || null;" not in bridge:
              raise SystemExit("Responsive visible language-selector handling is missing")
          if "allRoots.filter(isElementVisible)" not in bridge:
              raise SystemExit("Translation must prioritize visible creator/recipient roots")
          if "function isUserAuthoredElement(element)" not in bridge or 'data-lovena-user-content="true"' not in html:
              raise SystemExit("Authored text must be excluded from automatic translation")
          if 'userAuthoredFields:[]' not in html or "markUserAuthoredField(key)" not in html:
              raise SystemExit("User-authored field tracking is missing")
          if 'translation-bridge.js?v=20261022-mobile-language-8' not in html:
              raise SystemExit("Mobile browser cache-bust version is missing")
          if 'language: function () { return selectedLanguage() || activeLanguage; }' not in bridge:
              raise SystemExit("Translation bridge must read the current language selector")
          if "translateMarkup: async function (markup, language)" not in bridge:
              raise SystemExit("Standalone story localization is missing")
          if "async function downloadStory()" not in html or "bridge.translateMarkup(storyMarkup,exportLanguage)" not in html:
              raise SystemExit("The downloadable story is not using the selected language")
          if "function localizeExportScript(script,labels)" not in html or "localizeExportScript(exportScript,exportLabels)" not in html:
              raise SystemExit("Localized standalone interaction labels are missing")
          if 'bridge.translateText("scratch gently to open",language)' not in html:
              raise SystemExit("Scratch-to-reveal labels are not localized")
          if "translate.googleapis.com/translate_a/single" not in bridge:
              raise SystemExit("Dynamic UI translation engine is missing")
          if 'if (first === SOURCE_LANGUAGE.toLowerCase()) lang = parts[parts.length - 1];' not in bridge:
              raise SystemExit("GTranslate source-target language parsing is missing")
          if '"studioOverlay", "readerOverlay", "studioToast", "loveWorldHeadingCopy"' not in bridge:
              raise SystemExit("Full creator/preview translation roots are missing")
          if "function renderStudio(){renderBody();if(window.LovenaTranslationBridge)window.LovenaTranslationBridge.refresh();}" not in html:
              raise SystemExit("Creator render is not wired to the translation bridge")
          Path("/tmp/lovena-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/lovena-inline.js
          node --check translation-bridge.js
          node <<'NODE'
          const fs = require("fs");
          const bridge = fs.readFileSync("translation-bridge.js", "utf8");
          const start = bridge.indexOf("  function canonicalLanguage(value) {");
          const end = bridge.indexOf("\n  function readSavedLanguage", start);
          if (start < 0 || end < 0) throw new Error("Could not extract GTranslate language parser");
          const parserSource = bridge.slice(start, end).replace("  function canonicalLanguage(value)", "return function canonicalLanguage(value)");
          const parseLanguage = new Function("SOURCE_LANGUAGE", parserSource) ("en");
          const cases = [["en|pt","pt"],["en|es","es"],["en|en","en"],["pt|en","pt"],["fr","fr"]];
          for (const [input, expected] of cases) {
            const actual = parseLanguage(input);
            if (actual !== expected) throw new Error(input + " parsed as " + actual + ", expected " + expected);
          }
          console.log("GTranslate language-value tests passed.");
          NODE
          node <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("/tmp/lovena-inline.js", "utf8");
          const exportStart = src.indexOf("var exportScript=");
          const helperStart = src.indexOf("function localizeExportScript", exportStart);
          const exportEnd = helperStart < 0 ? -1 : src.lastIndexOf(";", helperStart);
          if (exportStart < 0 || exportEnd < 0) throw new Error("Standalone story export was not found");
          const exportExpression = src.slice(exportStart + "var exportScript=".length, exportEnd).trim();
          const exportLabels = {forWord:"For",someoneSpecial:"someone special",topbarSmall:"A story made just for you",topbarTagline:"A personal keepsake ♡",scratchPrompt:"scratch gently to open",scratchSubline:"little things are waiting underneath",wallEmpty:"The wall is waiting for its first little message.",friend:"A friend"};
          const generated = Function("state", "exportLabels", "return (" + exportExpression + ");")({recipient:"Lovena Validation"}, exportLabels);
          const embedded = generated.match(/<script>([\s\S]*?)<\/script>/);
          if (!embedded) throw new Error("Standalone story script was not generated");
          fs.writeFileSync("/tmp/lovena-export.js", embedded[1]);
          NODE
          node --check /tmp/lovena-export.js
      - name: Smoke test keyless dynamic translation endpoint (non-blocking)
        continue-on-error: true
        run: |
          node <<'NODE'
          (async () => {
            const url = new URL("https://translate.googleapis.com/translate_a/single");
            url.searchParams.set("client", "gtx");
            url.searchParams.set("sl", "en");
            url.searchParams.set("tl", "pt");
            url.searchParams.set("dt", "t");
            url.searchParams.set("q", "How are you today?");
            try {
              const origin = "https://flaviosilva-create.github.io";
              const response = await fetch(url, { headers: { "Accept": "application/json", "Origin": origin } });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const allowOrigin = response.headers.get("access-control-allow-origin");
              if (allowOrigin !== "*" && allowOrigin !== origin) throw new Error("CORS does not allow the Lovena origin (header: " + allowOrigin + ")");
              const data = await response.json();
              const translated = Array.isArray(data?.[0]) ? data[0].map(x => x?.[0] || "").join("") : "";
              if (!translated || translated === "How are you today?") throw new Error("No translated text was returned");
              console.log("Keyless dynamic translation endpoint passed: " + translated);
            } catch (error) {
              console.log("Keyless dynamic translation endpoint failed: " + error.message);
              process.exitCode = 1;
            }
          })();
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
