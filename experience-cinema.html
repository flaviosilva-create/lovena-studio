<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="A private world made from your favorite memories.">
  <title>Our Story — Lovena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:dark;
      --bg:#050505;--panel:#111;--panel2:#191919;--white:#fff;--muted:#aaa;
      --soft:#e7e3df;--accent:#d52b36;--line:rgba(255,255,255,.12);
      --nav-h:76px;--shelf-h:clamp(164px,29svh,260px);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--white);font-family:"DM Sans",Arial,sans-serif;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
    button,a,input{font:inherit}
    button{color:inherit}
    a{color:inherit;text-decoration:none}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #f0a4a9;outline-offset:3px}
    [hidden]{display:none!important}
    .hero{
      position:relative;isolation:isolate;min-height:680px;height:76svh;max-height:980px;
      overflow:hidden;background:#16100e;display:flex;align-items:flex-end
    }
    .hero-backdrop{position:absolute;z-index:0;inset:0;overflow:hidden;background:#16100e;transform:scale(1.015)}
    .hero-backdrop img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 43%}
    .hero-backdrop:after{content:"";position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(0,0,0,.64) 0%,rgba(0,0,0,.14) 22%,rgba(0,0,0,.05) 46%,rgba(0,0,0,.55) 71%,#050505 100%),
      linear-gradient(90deg,rgba(0,0,0,.34),transparent 72%)}
    .topbar{
      position:absolute;z-index:5;left:0;right:0;top:0;min-height:76px;padding:19px clamp(19px,5.5vw,78px);
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      background:linear-gradient(180deg,rgba(0,0,0,.58),transparent)
    }
    .brand{display:inline-flex;align-items:center;gap:9px;min-width:0}
    .brand-mark{font-family:Manrope,sans-serif;font-weight:800;font-size:42px;line-height:.8;letter-spacing:-7px;color:var(--accent);padding-right:7px;text-shadow:0 2px 12px #000}
    .brand-name{font:800 14px/1 Manrope,sans-serif;letter-spacing:2.1px;color:#fff;text-shadow:0 2px 12px #000}
    .top-actions{display:flex;align-items:center;gap:clamp(12px,2.4vw,27px)}
    .icon-btn{
      position:relative;display:grid;place-items:center;width:32px;height:36px;padding:0;border:0;background:transparent;color:#fff;cursor:pointer
    }
    .icon-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.15;stroke-linecap:round;stroke-linejoin:round}
    .notification-dot{position:absolute;top:0;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:1.5px solid #fff}
    .avatar-btn{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.52);border-radius:50%;background:linear-gradient(145deg,#bb8f79,#4a2827);box-shadow:0 2px 10px #0008;cursor:pointer}
    .avatar-btn span{font:600 18px/1 Georgia,serif}
    .category-nav{
      position:absolute;z-index:4;top:86px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;
      gap:clamp(24px,6vw,61px);width:max-content;max-width:calc(100% - 30px);
      color:#fff;font:700 13px/1.3 Manrope,sans-serif;text-shadow:0 2px 9px #000
    }
    .category-nav a{white-space:nowrap;opacity:.95;transition:opacity .2s}
    .category-nav a:hover{opacity:.7}
    .hero-copy{
      position:relative;z-index:2;width:min(720px,calc(100% - 42px));margin:0 auto 27px;
      display:flex;flex-direction:column;align-items:center;text-align:center
    }
    .eyebrow{margin:0 0 10px;color:#f3d4d0;font:800 9px/1.4 Manrope,sans-serif;letter-spacing:3.6px;text-transform:uppercase;text-shadow:0 2px 10px #000}
    h1{margin:0 0 13px;max-width:700px;font:800 clamp(36px,6vw,66px)/.98 Manrope,sans-serif;letter-spacing:-2px;text-wrap:balance;text-shadow:0 3px 18px #000a}
    .hero-description{max-width:550px;margin:0;color:#f0ece8;font:500 12px/1.65 "DM Sans",sans-serif;text-shadow:0 2px 10px #000}
    .hero-controls{width:min(580px,100%);display:flex;justify-content:space-between;align-items:flex-end;gap:13px;margin:21px auto 0}
    .action-stack{min-width:52px;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;cursor:pointer}
    .action-symbol{display:grid;place-items:center;width:28px;height:28px;font:300 30px/1 Arial,sans-serif}
    .action-label{font:600 9px/1.2 Manrope,sans-serif;color:#fff;white-space:nowrap}
    .action-stack.is-saved .action-symbol{color:#f1a9a9}
    .play-button{
      min-width:153px;height:49px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
      border:0;border-radius:5px;padding:0 22px;background:#f5f2ee;color:#171311;
      box-shadow:0 3px 12px #0006;font:800 15px/1 Manrope,sans-serif;cursor:pointer;transition:transform .18s,background .18s
    }
    .play-button:hover{transform:translateY(-2px);background:#fff}
    .play-button svg{width:20px;height:20px;fill:currentColor}
    .soundless-action{display:grid;place-items:center;width:42px;height:42px;padding:0;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:#0004;color:#fff;cursor:pointer}
    .soundless-action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .shelf{position:relative;z-index:2;padding:18px clamp(17px,5.3vw,76px) 27px;background:#050505}
    .shelf-inner{max-width:1500px;margin:0 auto}
    .shelf-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 13px}
    .shelf-heading h2{margin:0;color:#fff;font:800 18px/1.2 Manrope,sans-serif;letter-spacing:.35px;text-transform:uppercase}
    .shelf-heading p{display:none}
    .shelf-more{padding:6px 0;border:0;background:transparent;color:#c8c3bf;font:600 9px/1.2 Manrope,sans-serif;cursor:pointer;white-space:nowrap}
    .rail-wrap{position:relative}
    .rail{
      display:flex;flex-flow:row nowrap;align-items:stretch;gap:12px;width:100%;
      overflow-x:auto;overflow-y:hidden;padding:3px 2px 10px;scrollbar-width:none;overscroll-behavior-x:contain
    }
    .rail::-webkit-scrollbar{display:none}
    .memory-card{
      position:relative;isolation:isolate;flex:0 0 clamp(128px,16vw,202px);width:clamp(128px,16vw,202px);
      aspect-ratio:.77;overflow:hidden;padding:0;border:1px solid rgba(255,255,255,.09);border-radius:11px;
      background:#181818;box-shadow:0 5px 16px #0006;cursor:pointer;transform:translateZ(0);transition:transform .2s,box-shadow .2s
    }
    .memory-card:hover{transform:translateY(-3px);box-shadow:0 12px 25px #0009}
    .memory-image{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center;background:#26201f;transition:transform .45s}
    .memory-card:hover .memory-image{transform:scale(1.035)}
    .memory-card:after{content:"";position:absolute;z-index:1;inset:45% 0 0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82))}
    .memory-caption{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:27px 10px 11px;text-align:left;color:#fff;font:700 10px/1.35 Manrope,sans-serif;text-shadow:0 2px 9px #000}
    .memory-save{position:absolute;z-index:3;right:7px;top:7px;width:29px;height:29px;display:grid;place-items:center;border:1px solid #ffffff80;border-radius:50%;background:#0008;color:#fff;cursor:pointer;opacity:0;transition:opacity .2s}
    .memory-card:hover .memory-save,.memory-save:focus-visible,.memory-save.is-saved{opacity:1}
    .memory-save svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
    .memory-save.is-saved{color:#ffc5c5;background:#481d24}
    .empty-state{padding:23px 18px;border:1px dashed #ffffff27;border-radius:10px;color:#aaa;font-size:11px;line-height:1.6}
    .my-list-shelf{display:none}
    .my-list-shelf.is-visible{display:block}
    .site-footer{padding:10px 20px 24px;text-align:center;color:#666;font-size:9px;letter-spacing:.7px}
    .bottom-nav{
      position:fixed;z-index:50;left:0;right:0;bottom:0;min-height:var(--nav-h);
      display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;
      padding:7px max(9px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-right));
      border-top:1px solid rgba(255,255,255,.1);background:rgba(3,3,3,.97);backdrop-filter:blur(12px)
    }
    .bottom-nav button{height:58px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:3px 1px;border:0;background:transparent;color:#898684;cursor:pointer;font:600 8px/1.2 Manrope,sans-serif;white-space:nowrap}
    .bottom-nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .bottom-nav button[aria-current="page"]{color:#fff}
    .bottom-nav button[aria-current="page"] svg{fill:currentColor}
    .overlay{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.88);backdrop-filter:blur(10px)}
    .dialog-panel{position:relative;width:min(650px,100%);max-height:min(86svh,800px);overflow:auto;padding:26px;border:1px solid #ffffff20;border-radius:13px;background:#111;box-shadow:0 25px 80px #000}
    .dialog-close{position:absolute;right:13px;top:12px;width:36px;height:36px;border:1px solid #ffffff33;border-radius:50%;background:#222;color:#fff;font-size:23px;cursor:pointer}
    .dialog-kicker{margin:0 0 10px;color:#d99d95;font:800 9px/1.3 Manrope,sans-serif;letter-spacing:2px;text-transform:uppercase}
    .dialog-title{margin:0 44px 13px 0;font:800 clamp(22px,4vw,32px)/1.1 Manrope,sans-serif}
    .dialog-copy{margin:0;color:#d1cac5;font-size:13px;line-height:1.7;white-space:pre-line}
    .search-input{width:100%;height:47px;margin:7px 0 14px;padding:0 14px;border:1px solid #ffffff2c;border-radius:7px;background:#080808;color:#fff;font-size:13px}
    .slideshow{position:fixed;z-index:120;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.96)}
    .slide-frame{position:relative;width:min(900px,100%);height:min(78svh,760px);display:flex;align-items:center;justify-content:center}
    .slide-image{position:absolute;inset:0;background:#111 center/contain no-repeat}
    .slide-gradient{position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(transparent,#000b)}
    .slide-caption{position:absolute;left:20px;right:20px;bottom:23px;text-align:center;font:800 clamp(17px,3vw,25px)/1.2 Manrope,sans-serif;text-shadow:0 2px 10px #000}
    .slide-control{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:43px;height:43px;border:1px solid #fff8;border-radius:50%;background:#0008;color:#fff;font-size:27px;cursor:pointer}
    .slide-prev{left:0}.slide-next{right:0}
    .slide-close{position:absolute;z-index:5;top:13px;right:13px;width:42px;height:42px;border:1px solid #ffffff77;border-radius:50%;background:#111;color:#fff;font-size:24px;cursor:pointer}
    .slide-counter{position:absolute;z-index:4;top:24px;left:20px;color:#ddd;font:600 10px/1.2 Manrope,sans-serif}
    .toast{position:fixed;z-index:150;left:50%;bottom:calc(var(--nav-h) + 15px);transform:translate(-50%,12px);max-width:calc(100% - 32px);padding:11px 16px;border:1px solid #ffffff22;border-radius:999px;background:#222;color:#fff;font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
    .toast.is-visible{opacity:1;transform:translate(-50%,0)}
    @media(min-width:1000px){
      .hero{height:80svh;min-height:700px}
      .hero-copy{margin-bottom:35px}
      .shelf{padding-top:22px;padding-bottom:31px}
      .rail{gap:16px}
    }
    @media(max-width:650px){
      :root{--nav-h:70px}
      .hero{height:74svh;min-height:600px;max-height:840px}
      .topbar{min-height:66px;padding:16px 17px}
      .brand-mark{font-size:36px}
      .brand-name{font-size:12px;letter-spacing:1.6px}
      .top-actions{gap:11px}
      .icon-btn{width:27px;height:32px}
      .icon-btn svg{width:20px;height:20px}
      .avatar-btn{width:30px;height:30px}
      .category-nav{top:76px;gap:clamp(20px,7vw,42px);font-size:12px}
      .hero-copy{width:calc(100% - 28px);margin-bottom:19px}
      .eyebrow{font-size:8px;letter-spacing:2.8px;margin-bottom:8px}
      h1{font-size:clamp(32px,8.6vw,48px);letter-spacing:-1.25px;margin-bottom:10px}
      .hero-description{max-width:390px;font-size:10px;line-height:1.55}
      .hero-controls{width:100%;gap:7px;margin-top:14px}
      .play-button{min-width:125px;height:45px;padding:0 15px;font-size:13px}
      .play-button svg{width:18px;height:18px}
      .action-stack{min-width:38px;gap:4px}
      .action-symbol{width:24px;height:25px;font-size:27px}
      .action-label{font-size:8px}
      .soundless-action{width:36px;height:36px}
      .shelf{padding:15px 14px 22px}
      .shelf-heading{margin-bottom:10px}
      .shelf-heading h2{font-size:16px}
      .rail{gap:10px}
      .memory-card{flex-basis:clamp(116px,27vw,165px);width:clamp(116px,27vw,165px);border-radius:9px}
      .memory-caption{font-size:9px;padding:22px 8px 9px}
      .memory-save{opacity:1;width:26px;height:26px}
      .bottom-nav button{height:54px;font-size:7.5px}
      .bottom-nav button svg{width:21px;height:21px}
      .dialog-panel{padding:23px 18px}
      .slide-frame{height:76svh}
    }
    @media(max-width:365px){
      .top-actions{gap:7px}
      .brand-name{font-size:11px}
      .category-nav{gap:17px;font-size:11px}
      .hero-controls{gap:4px}
      .play-button{min-width:108px;padding:0 10px}
      .action-label{font-size:7px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}
    }
  </style>
<style id="lovena-one-screen-layout">
  html,body{width:100%;height:100%;min-height:0;overflow:hidden!important}
  body{padding:0!important;margin:0!important}
  #app{
    display:grid!important;
    grid-template-columns:minmax(0,1fr)!important;
    grid-template-rows:minmax(0,1fr) var(--shelf-h)!important;
    width:100%;height:calc(100svh - var(--nav-h));height:calc(100dvh - var(--nav-h));
    min-height:0;overflow:hidden!important
  }
  #home.hero{
    grid-row:1;grid-column:1;width:100%;height:100%!important;min-height:0!important;max-height:none!important;
    overflow:hidden!important
  }
  #memories.shelf{
    grid-row:2;grid-column:1;width:100%;height:var(--shelf-h)!important;min-height:0!important;
    padding:12px clamp(14px,4.2vw,60px) 12px!important;overflow:hidden!important
  }
  #memories .shelf-inner{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  #memories .shelf-heading{flex:0 0 22px;height:22px;min-height:22px;margin:0 0 8px!important}
  #memories .shelf-heading h2{font-size:clamp(14px,1.5vw,18px)!important}
  #memories .rail-wrap{flex:1 1 auto;height:auto;min-height:0;overflow:hidden}
  #memories .rail{
    width:100%;height:100%;min-height:0;align-items:stretch;
    gap:clamp(9px,1.25vw,16px);padding:2px 2px 4px!important;
    overflow-x:auto;overflow-y:hidden
  }
  #memories .memory-card{
    flex:0 0 clamp(92px,calc((var(--shelf-h) - 60px)*.70),170px);
    width:clamp(92px,calc((var(--shelf-h) - 60px)*.70),170px);
    height:calc(var(--shelf-h) - 60px);min-height:0;aspect-ratio:auto
  }
  #memories .memory-caption{font-size:clamp(8px,.8vw,10px);padding:22px 8px 8px}
  .site-footer{display:none!important}
  .my-list-shelf,.my-list-shelf.is-visible{display:none!important}
  .bottom-nav{z-index:60;min-height:var(--nav-h);max-height:var(--nav-h)}
  .hero-copy{margin-bottom:clamp(12px,2.8svh,28px)!important}
  @media(max-width:650px){
    :root{--nav-h:70px;--shelf-h:clamp(154px,28svh,220px)}
    #memories.shelf{padding:10px 13px 10px!important}
    #memories .shelf-heading{flex-basis:20px;height:20px;min-height:20px;margin-bottom:7px!important}
    #memories .shelf-heading h2{font-size:15px!important}
    #memories .memory-card{
      flex-basis:clamp(91px,calc((var(--shelf-h) - 54px)*.70),145px);
      width:clamp(91px,calc((var(--shelf-h) - 54px)*.70),145px);
      height:calc(var(--shelf-h) - 54px)
    }
    #home .hero-copy{width:calc(100% - 28px);margin-bottom:12px!important}
    #home .hero-description{max-width:390px;font-size:10px;line-height:1.5}
    #home .hero-controls{margin-top:12px}
    #home .topbar{min-height:62px}
    #home .category-nav{top:72px}
    .bottom-nav{min-height:var(--nav-h);max-height:var(--nav-h)}
  }
  @media(max-height:650px){
    :root{--shelf-h:clamp(140px,25svh,166px)}
    #memories.shelf{padding-top:8px!important;padding-bottom:8px!important}
    #memories .shelf-heading{margin-bottom:5px!important}
    #memories .memory-card{height:calc(var(--shelf-h) - 48px);flex-basis:clamp(86px,calc((var(--shelf-h) - 48px)*.70),118px);width:clamp(86px,calc((var(--shelf-h) - 48px)*.70),118px)}
    #home .topbar{min-height:54px;padding-top:10px;padding-bottom:10px}
    #home .category-nav{top:62px;font-size:11px}
    #home .hero-copy{margin-bottom:8px!important}
    #home h1{font-size:clamp(27px,5vh,42px);margin-bottom:6px}
    #home .eyebrow{margin-bottom:5px}
    #home .hero-description{font-size:9px;line-height:1.35}
    #home .hero-controls{margin-top:8px}
    #home .play-button{height:40px}
  }
</style>
</head>
<body>
  <main id="app">
    <section class="hero" id="home" aria-labelledby="heroTitle">
      <div class="hero-backdrop" id="heroBackdrop"><img id="heroPhoto" src="./assets/lovena-experience-hero-hq.jpg" alt="The Lovena couple" fetchpriority="high"></div>
      <header class="topbar">
        <a href="#home" class="brand" aria-label="Lovena home"><span class="brand-mark" aria-hidden="true">L</span><span class="brand-name">LOVENA</span></a>
        <div class="top-actions" aria-label="Quick actions">
          <button class="icon-btn" type="button" data-command="search" aria-label="Search memories" title="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg></button>
          <button class="icon-btn" type="button" data-command="list" aria-label="Open My List" title="Discover"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notification-dot"></span></button>
          <button class="avatar-btn" type="button" data-command="profile" aria-label="About this story" title="About"><span>♡</span></button>
          <button class="icon-btn" type="button" data-command="filters" aria-label="Browse sections" title="Browse"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#050505"/><circle cx="15" cy="12" r="2" fill="#050505"/><circle cx="7" cy="18" r="2" fill="#050505"/></svg></button>
        </div>
      </header>
      <nav class="category-nav" aria-label="Browse story">
        <a href="#" data-command="profile">Our Story</a>
        <a href="#memories">Memories</a>
        <a href="#" data-command="list">My List</a>
      </nav>
      <div class="hero-copy">
        <p class="eyebrow" id="heroEyebrow">A LOVENA ORIGINAL</p>
        <h1 id="heroTitle">You are my favourite story.</h1>
        <p class="hero-description" id="heroDescription">A world made of the moments, smiles and little memories that belong only to us.</p>
        <div class="hero-controls">
          <button class="action-stack" type="button" id="myListToggle" aria-pressed="false">
            <span class="action-symbol" id="myListIcon" aria-hidden="true">＋</span><span class="action-label" id="myListLabel">My List</span>
          </button>

      openDialog("BROWSE","Explore this story","",panel);
    }
    function command(name){
      if(name==="search")handleSearch();
      if(name==="list")openMyList();
      if(name==="profile")openProfile();
      if(name==="filters")openBrowse();
      if(name==="info")openProfile();
      if(name==="share")shareStory();
    }
    function setupEvents(){
      document.querySelectorAll("[data-command]").forEach(function(button){button.addEventListener("click",function(){command(button.dataset.command);});});
      document.getElementById("myListToggle").addEventListener("click",function(){
        storySaved=!storySaved;persistSaved();updateMyListButton();renderMyList();
        showToast(storySaved?t("saved"):t("list"));
      });
      document.getElementById("playStory").addEventListener("click",function(){startSlideshow(0);});
      document.getElementById("viewAllMemories").addEventListener("click",function(){startSlideshow(0);});
      document.querySelectorAll("[data-destination]").forEach(function(button){
        button.addEventListener("click",function(){
          var id=button.dataset.destination;
          document.querySelectorAll("[data-destination]").forEach(function(b){if(b===button)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
          if(id==="my-list")openMyList();else scrollTo(id);
        });
      });
      document.querySelectorAll("[data-close-dialog]").forEach(function(button){button.addEventListener("click",closeDialog);});
      document.getElementById("dialog").addEventListener("click",function(event){if(event.target.id==="dialog")closeDialog();});
      document.getElementById("closeSlideshow").addEventListener("click",stopSlideshow);
      document.getElementById("prevSlide").addEventListener("click",function(){stepSlide(-1);});
      document.getElementById("nextSlide").addEventListener("click",function(){stepSlide(1);});
      document.getElementById("slideshow").addEventListener("click",function(event){if(event.target.id==="slideshow")stopSlideshow();});
      document.getElementById("my-list").addEventListener("click",function(event){var button=event.target.closest(".memory-card");if(button&&button.dataset.memoryId){var item=memories.find(function(memory){return memory.id===button.dataset.memoryId;});if(item)openMemory(item);}});
      document.addEventListener("keydown",function(event){
        if(event.key==="Escape"){closeDialog();stopSlideshow();}
        if(!document.getElementById("slideshow").hidden&&event.key==="ArrowRight")stepSlide(1);
        if(!document.getElementById("slideshow").hidden&&event.key==="ArrowLeft")stepSlide(-1);
      });
    }
    function applyExperience(){
      texts=snapshot.texts||{};
      images=snapshot.images||{};
      data=snapshot.data||{};
      locale=(experience&&experience.locale)||snapshot.locale||"en";
      if(String(locale).toLowerCase().startsWith("pt"))locale="pt-BR";
      else if(String(locale).toLowerCase().startsWith("es"))locale="es";
      else locale="en";
      document.documentElement.lang=locale;
      updateHero();memories=buildMemories();applyTranslations();updateSections();
    }
    async function loadExperience(){
      loadSaved();
      if(isDemo){
        experience={locale:"en"};
        snapshot={texts:{heroTitle:"You are my favourite story.",heroIntro:"A private world made from the moments, smiles and little memories that belong only to us.",heroEyebrow:"A LOVENA ORIGINAL",brand:"ALEX & JAMIE"},images:{hero:fallbackHero,gallery:fallbackPhotos.map(function(p){return p[1];})},data:{photos:fallbackPhotos.map(function(p){return [p[0],"A beautiful moment, kept just for us."];})}};
      }else{
        var response=await fetch(SUPABASE_URL+"/functions/v1/lovena-public-experience?slug="+encodeURIComponent(slug),{method:"GET",headers:{apikey:SUPABASE_KEY},cache:"no-store"});
        var body=await response.json().catch(function(){return {};});
        if(!response.ok||!body.experience)throw new Error(body.error||"This Lovena experience could not be loaded.");
        experience=body.experience;snapshot=experience.data||{};
      }
      applyExperience();
      document.getElementById("emptyList").hidden=storySaved||savedIds.length>0;
      if(memories.length===0){var empty=document.createElement("div");empty.className="empty-state";empty.textContent=t("noPhotos");document.getElementById("memoryRail").appendChild(empty);}
    }
    setupEvents();
    loadExperience().catch(function(error){
      console.error("Lovena Cinema load:",error);
      openDialog("LOVENA","This story is unavailable",error.message||"Please check the link and try again.");
    });
  })();
  </script>
</body>
</html>
